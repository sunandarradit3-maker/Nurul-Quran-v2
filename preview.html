<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d3d35"><title>Nurul Quran V2 — Preview</title><style>:root{--b:#f4f1e8;--c:#fffdf7;--t:#17332d;--m:#6d7a75;--p:#0d3d35;--p2:#175c4f;--g:#c9a45e;--l:#d9d7cc;--s:#e5ede9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#e8dfc6 0,transparent 28rem),var(--b);color:var(--t);font-family:Inter,system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.top{position:sticky;top:8px;z-index:8;max-width:1180px;margin:8px auto;padding:10px 12px;background:#fffdf7e8;border:1px solid var(--l);border-radius:20px;backdrop-filter:blur(16px);display:flex;align-items:center;gap:14px}.brand{border:0;background:none;display:flex;align-items:center;gap:9px;font-weight:900}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--p);color:white;font:25px Georgia}.brand small{display:block;color:var(--m);font-weight:500;font-size:9px}.nav{display:flex;gap:3px;margin:auto}.nav button{border:0;background:transparent;padding:9px 10px;border-radius:10px;font-size:11px;font-weight:800;color:var(--m)}.nav button.on{background:var(--s);color:var(--p2)}.theme{border:1px solid var(--l);background:var(--c);width:40px;height:40px;border-radius:12px}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.hero{padding:70px 0 44px;display:grid;grid-template-columns:1.1fr .9fr;gap:42px;align-items:center}.ey{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:var(--p2)}h1,h2,h3{font-family:Georgia,serif;font-weight:500}.hero h1{font-size:clamp(48px,7vw,78px);line-height:.98;letter-spacing:-.045em;margin:14px 0}.hero p,.lead{color:var(--m);line-height:1.75}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.pri,.sec{border-radius:14px;min-height:46px;padding:0 15px;font-weight:900;border:1px solid var(--l)}.pri{background:var(--p);color:white;border-color:var(--p)}.sec{background:var(--c)}.ayat{min-height:360px;border-radius:30px;background:linear-gradient(145deg,#0c3d34,#214b41);color:white;padding:27px;display:flex;flex-direction:column;box-shadow:0 24px 60px #173b3030}.ayat .ar{font:44px/1.9 Georgia;text-align:center;margin:auto 0 10px}.ayat .id{text-align:center;color:#ffffffbb;line-height:1.65}.pill{display:inline-block;padding:6px 9px;border:1px solid #ffffff30;border-radius:99px;color:#ead291;font-size:10px}.head{padding:48px 0 18px}.head h1{font-size:48px;line-height:1.02;margin:10px 0}.search{display:flex;gap:8px;background:var(--c);border:1px solid var(--l);border-radius:14px;padding:12px;margin-top:20px}.search input{border:0;outline:0;background:transparent;width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 0 60px}.card{border:1px solid var(--l);border-radius:20px;background:#fffdf7cc;padding:18px;text-align:left;min-height:210px}.card:hover{border-color:#c9a45e}.icon{width:42px;height:42px;border-radius:13px;background:var(--s);display:grid;place-items:center;color:var(--p2);font-weight:900;font-size:20px}.meta{margin-top:22px;color:var(--p2);font-size:9px;text-transform:uppercase;letter-spacing:.11em;font-weight:900}.card h3{font-size:23px;margin:9px 0}.card p{color:var(--m);font-size:12px;line-height:1.65}.tags{display:flex;gap:5px;flex-wrap:wrap}.tags span{background:var(--s);border-radius:99px;padding:5px 7px;font-size:9px}.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:50px}.surah{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid var(--l);background:var(--c);border-radius:16px;padding:13px;text-align:left}.num{width:34px;height:34px;border-radius:10px;background:var(--s);display:grid;place-items:center;font-size:10px;font-weight:900}.surah b{font-size:12px}.surah small{display:block;color:var(--m);font-size:9px;margin-top:4px}.sar{font:20px Georgia;color:var(--p2)}.reader{padding-bottom:60px}.back{border:0;background:none;color:var(--p2);font-weight:900;padding:0 0 14px}.banner{border-radius:22px;background:var(--p);color:white;padding:22px;display:flex;justify-content:space-between;align-items:center}.banner h2{font-size:30px;margin:5px 0}.banner .ba{font:44px Georgia}.verses{display:grid;gap:8px;margin-top:10px}.verse{border:1px solid var(--l);border-radius:18px;background:var(--c);padding:17px}.vtop{display:flex;justify-content:space-between;color:var(--m);font-size:10px}.play{border:1px solid var(--l);background:var(--s);border-radius:10px;padding:6px 9px}.var{font:30px/2 Georgia;text-align:right}.vid{color:var(--m);line-height:1.75;font-size:13px}.notice{border:1px solid #c9a45e60;background:#efe0b9;border-radius:17px;padding:14px;margin-bottom:12px;color:#51462f}.notice p{font-size:11px;line-height:1.6;margin:5px 0 0}.hide{display:none!important}.bottom{display:none}.foot{border-top:1px solid var(--l);padding:30px 0 90px;color:var(--m);font-size:10px;line-height:1.65}.dark{--b:#081b18;--c:#102c27;--t:#f5f1e7;--m:#aebcb7;--p:#d8b76c;--p2:#eccf8b;--l:#ffffff1c;--s:#7fb9a71f}.dark .pri{color:#17332d}.dark .mark{color:#17332d}.dark .card,.dark .top{background:#102c27e8}.dark .ayat{background:linear-gradient(145deg,#163f37,#1f5549)}@media(max-width:850px){.nav{display:none}.hero{grid-template-columns:1fr}.grid,.qgrid{grid-template-columns:1fr 1fr}.top{margin:7px}.bottom{position:fixed;bottom:7px;left:7px;right:7px;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);background:#fffdf7ef;border:1px solid var(--l);border-radius:16px;padding:4px;backdrop-filter:blur(16px)}.dark .bottom{background:#102c27ef}.bottom button{border:0;background:none;padding:8px 2px;border-radius:11px;font-size:8px;font-weight:800}.bottom button.on{background:var(--s);color:var(--p2)}}@media(max-width:560px){.wrap{width:calc(100% - 20px)}.hero{padding-top:45px}.hero h1{font-size:49px}.ayat{min-height:320px}.grid,.qgrid{grid-template-columns:1fr}.head h1{font-size:40px}.brand small{display:none}.banner .ba{font-size:31px}.var{font-size:27px}.card{min-height:190px}}</style></head><body><header class="top"><button class="brand" onclick="show('home')"><span class="mark">ن</span><span>Nurul Quran V2<small>Qur'an • Ibadah • Kisah • Pengetahuan</small></span></button><nav class="nav" id="nav"></nav><button class="theme" onclick="toggleTheme()">☾</button></header><main id="app"></main><footer class="wrap foot">Nurul Quran V2 • Preview white-label DiTz Store. Konten lintas agama adalah pengantar netral; detail ajaran/praktik perlu diverifikasi ke sumber resmi komunitas masing-masing sebelum dijual sebagai materi keagamaan resmi.</footer><nav class="bottom" id="bottom"></nav><script>const V=[['home','Beranda'],['quran',"Al-Qur'an"],['doa','Doa'],['learn','Belajar'],['stories','Kisah'],['faith','Agama']];const D={doa:[['د','Doa sebelum makan','Harian','Bismillāh — Dengan nama Allah.'],['د','Doa untuk orang tua','Keluarga','Rabbi irhamhumā kamā rabbayānī shaghīrā.'],['د','Doa memohon ilmu','Belajar','Rabbi zidnī ‘ilmā.'],['د','Doa perjalanan','Perjalanan','Doa safar dengan sumber Al-Qur’an 43:13–14.'],['د','Doa kebaikan dunia akhirat','Pilihan','Rabbanā ātinā fid-dunyā hasanah...'],['د','Istighfar','Dzikir','Astaghfirullāh — memohon ampun kepada Allah.']],learn:[['✦','Wudhu','Bersuci','Niat, membasuh anggota wudhu, tertib, dan catatan perbedaan mazhab.'],['✦','Mandi wajib','Bersuci','Niat dan meratakan air ke seluruh tubuh sesuai ketentuan fikih.'],['✦','Tayamum','Bersuci','Panduan ketika air tidak tersedia atau tidak dapat digunakan sesuai syariat.'],['✦','Dasar shalat','Shalat','Syarat, rukun utama, gerakan, tuma’ninah, tasyahud, dan salam.'],['✦','Puasa Ramadan','Puasa','Niat, waktu puasa, hal yang perlu dijaga, dan kondisi uzur.'],['✦','Tajwid dasar',"Al-Qur'an",'Makhraj, mad, nun sukun/tanwin, mim sukun, dan latihan dengan qari.']],stories:[['☾','Nabi Yusuf','Islam • Kisah','Integritas, kesabaran, dan memaafkan ketika memiliki kekuatan.'],['☾','Nabi Ibrahim','Islam • Tokoh','Keteguhan tauhid, ujian, dan teladan keluarga.'],['☾','Nabi Muhammad','Islam • Sejarah','Fase Makkah, hijrah, Madinah, risalah, dan pembentukan komunitas.'],['✝','Yesus dalam tradisi Kristen','Kristen • Tokoh','Pengajaran, pelayanan, dan posisi sentral Yesus dalam iman Kristen.'],['☸','Siddhartha Gautama','Buddha • Tokoh','Pencerahan, kebijaksanaan, dan welas asih dalam tradisi Buddhis.'],['儒','Kongzi','Khonghucu • Tokoh','Pendidikan, kebajikan, relasi sosial, dan pembentukan karakter.']]};const F=[['☪','Islam','Tauhid • Ibadah • Akhlak','Al-Qur’an, hadis, nabi, masjid, Ramadan, Idulfitri dan Iduladha.'],['✝','Kekristenan','Kasih • Iman • Pelayanan','Alkitab, Yesus Kristus, gereja, Natal dan Paskah; denominasi beragam.'],['☩','Katolik','Sakramen • Persekutuan','Alkitab, Tradisi, Misa, sakramen, kalender liturgi dan kehidupan gereja.'],['ॐ','Hindu','Dharma • Karma • Bhakti','Veda, Upanishad, Bhagavad Gita, puja dan tradisi yang sangat beragam.'],['☸','Buddhisme','Welas asih • Kebijaksanaan','Tipitaka/sutra, Buddha, vihara, meditasi, sila, dana dan Waisak.'],['儒','Khonghucu','Ren • Yi • Li','Lunyu/Analects, Kongzi, pendidikan, ritus dan pembentukan kebajikan.'],['✡','Yudaisme','Torah • Komunitas • Etika','Tanakh, Torah, sinagoga, Shabbat dan hari raya Yahudi.'],['☬','Sikhisme','Seva • Kesetaraan • Iman','Guru Granth Sahib, Guru Nanak, gurdwara, langar dan pelayanan.']];let cur='home',surahs=[],reading=null,audio=null;function nav(){navEl('nav');navEl('bottom')}function navEl(id){document.getElementById(id).innerHTML=V.map(x=>`<button class="${cur==x[0]?'on':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}function show(v){cur=v;reading=null;nav();render();scrollTo({top:0,behavior:'smooth'})}function toggleTheme(){document.body.classList.toggle('dark');localStorage.nqTheme=document.body.classList.contains('dark')?'dark':'light'}if(localStorage.nqTheme==='dark')document.body.classList.add('dark');function hero(){return `<section class="wrap hero"><div><span class="ey">Qur'an • Ibadah • Kisah • Pengetahuan</span><h1>Satu ruang untuk belajar dengan tenang.</h1><p>Baca Al-Qur'an, dengarkan tilawah, pelajari wudhu dan mandi wajib, kumpulan doa, kisah, serta pengetahuan lintas agama dalam halaman terpisah dan netral.</p><div class="actions"><button class="pri" onclick="show('quran')">☾ Mulai Al-Qur'an</button><button class="sec" onclick="show('learn')">✦ Buka Belajar</button></div></div><aside class="ayat"><span class="pill">Asy-Syarh 94:5</span><div class="ar">فَإِنَّ مَعَ الْعُسْرِ يُسْرًا</div><div class="id">“Maka sesungguhnya bersama kesulitan ada kemudahan.”</div></aside></section><section class="wrap"><div class="head"><span class="ey">Versi 2.0</span><h1>Lebih dari website Qur'an.</h1><p class="lead">Source dirancang white-label: modul dan konten dipisah supaya mudah diganti untuk pembeli.</p></div><div class="grid">${[['☾',"Qur'an 30 Juz",'Arab, terjemahan Indonesia, audio per ayat dan daftar surah.'],['✦','Belajar Ibadah','Wudhu, mandi wajib, tayamum, shalat, puasa dan tajwid.'],['د','Kumpulan Doa','Kategori harian, keluarga, belajar, perjalanan dan dzikir.'],['◫','Kisah & Tokoh','Kisah nabi, sejarah Islam, dan pengantar tokoh tradisi lain.'],['◎','Lintas Agama','Setiap tradisi punya paket pengetahuan sendiri; tidak dicampur.'],['⚙','White-label Ready','Nama, warna, data dan modul mudah disesuaikan.']].map((x,i)=>`<button class="card" onclick="show('${['quran','learn','doa','stories','faith','home'][i]}')"><div class="icon">${x[0]}</div><div class="meta">Modul 0${i+1}</div><h3>${x[1]}</h3><p>${x[2]}</p></button>`).join('')}</div></section>`}function cards(type,title,desc){let a=D[type];return `<section class="wrap head"><span class="ey">Nurul Quran • ${title}</span><h1>${title}</h1><p class="lead">${desc}</p><label class="search">⌕ <input id="q" placeholder="Cari materi..." oninput="filterCards('${type}')"></label></section><section class="wrap grid" id="cards">${mkCards(a)}</section>`}function mkCards(a){return a.map(x=>`<article class="card"><div class="icon">${x[0]}</div><div class="meta">${x[2]}</div><h3>${x[1]}</h3><p>${x[3]}</p><div class="tags"><span>Ringkas</span><span>Source-ready</span></div></article>`).join('')}function filterCards(type){let q=document.getElementById('q').value.toLowerCase();document.getElementById('cards').innerHTML=mkCards(D[type].filter(x=>x.join(' ').toLowerCase().includes(q)))}function faith(){return `<section class="wrap head"><span class="ey">Pusat Pengetahuan</span><h1>Lintas agama, tetap terpisah.</h1><p class="lead">Tidak ada ranking agama atau pencampuran ritual. Detail doktrin harus memakai sumber komunitas yang relevan.</p></section><section class="wrap"><div class="notice"><b>Mode edukasi netral</b><p>Perbedaan denominasi, mazhab, aliran, wilayah, dan tradisi internal perlu dipertahankan saat materi diperluas.</p></div><div class="grid">${F.map(x=>`<article class="card"><div class="icon">${x[0]}</div><div class="meta">Paket pengetahuan</div><h3>${x[1]}</h3><p>${x[3]}</p><div class="tags">${x[2].split(' • ').map(t=>`<span>${t}</span>`).join('')}</div></article>`).join('')}</div></section>`}async function loadSurahs(){if(surahs.length)return;try{let r=await fetch('https://api.alquran.cloud/v1/surah');let j=await r.json();surahs=j.data||[]}catch(e){}}async function quran(){if(reading)return reader();document.getElementById('app').innerHTML=`<section class="wrap head"><span class="ey">Nurul Quran • Al-Qur'an</span><h1>Baca dan dengarkan Al-Qur'an.</h1><p class="lead">114 surah melalui Al Quran Cloud.</p><label class="search">⌕ <input id="sq" placeholder="Cari Yasin, Al-Kahf, nomor surah..." oninput="drawSurahs()"></label></section><section class="wrap qgrid" id="surahs"><div class="card">Memuat daftar surah…</div></section>`;await loadSurahs();drawSurahs()}function drawSurahs(){let q=(document.getElementById('sq')?.value||'').toLowerCase();let a=surahs.filter(s=>`${s.number} ${s.englishName} ${s.englishNameTranslation}`.toLowerCase().includes(q));document.getElementById('surahs').innerHTML=a.map(s=>`<button class="surah" onclick="openSurah(${s.number})"><span class="num">${s.number}</span><span><b>${s.englishName}</b><small>${s.numberOfAyahs} ayat • ${s.revelationType}</small></span><span class="sar">${s.name}</span></button>`).join('')||'<div class="card">Tidak ada surah.</div>'}async function openSurah(n){document.getElementById('surahs').innerHTML='<div class="card">Memuat surah…</div>';try{let [a,t,u]=await Promise.all([fetch(`https://api.alquran.cloud/v1/surah/${n}/quran-uthmani`).then(r=>r.json()),fetch(`https://api.alquran.cloud/v1/surah/${n}/id.indonesian`).then(r=>r.json()),fetch(`https://api.alquran.cloud/v1/surah/${n}/ar.alafasy`).then(r=>r.json())]);reading={...a.data,verses:a.data.ayahs.map((v,i)=>({...v,tr:t.data.ayahs[i]?.text||'',audio:u.data.ayahs[i]?.audio||''}))};render()}catch(e){document.getElementById('surahs').innerHTML='<div class="card">Gagal memuat surah. Coba lagi.</div>'}}function reader(){let s=reading;return `<section class="wrap reader"><button class="back" onclick="reading=null;render()">← Semua surah</button><div class="banner"><div><span class="ey" style="color:#e0c782">Surah ${s.number}</span><h2>${s.englishName}</h2><small>${s.numberOfAyahs} ayat • ${s.revelationType}</small></div><div class="ba">${s.name}</div></div><div class="verses">${s.verses.map((v,i)=>`<article class="verse"><div class="vtop"><b>${s.number}:${v.numberInSurah}</b><button class="play" onclick="play(${i})">▶ Audio</button></div><div class="var" dir="rtl">${v.text}</div><div class="vid">${v.tr}</div></article>`).join('')}</div></section>`}function play(i){if(audio)audio.pause();audio=new Audio(reading.verses[i].audio);audio.play()}function render(){let a=document.getElementById('app');if(cur==='home')a.innerHTML=hero();else if(cur==='doa')a.innerHTML=cards('doa','Kumpulan Doa','Doa harian dengan kategori, latin, arti, dan ruang untuk rujukan.');else if(cur==='learn')a.innerHTML=cards('learn','Belajar Ibadah','Panduan belajar dasar dengan catatan perbedaan mazhab.');else if(cur==='stories')a.innerHTML=cards('stories','Kisah & Tokoh','Kisah Islam sebagai modul utama plus pengantar tokoh lintas tradisi.');else if(cur==='faith')a.innerHTML=faith();else quran()}nav();render();</script></body></html>
